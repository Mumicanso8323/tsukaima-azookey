# 使い魔azooKey を TestFlight(内部テスト)へ上げる。SideStore 版は GitHub Actions の build.yml のまま。
# Codemagic の無料枠(月500分)で回す。起動は Codemagic の画面か API(start build)からだけ。push・PR では走らない。
# TestFlight 版は Config/testflight.xcconfig で TESTFLIGHT を立て、Springboard 配置(idevice + StosVPN)を外す。
definitions:
  scripts:
    - &assets
      name: 辞書・Zenzai の重み・IDevice.xcframework を用意する(build.yml と同じ固定版)
      script: |
        set -e
        git submodule update --init azooKey_emoji_dictionary_storage
        for m in "zenz-v3.2-small-gguf:c67e03e07d215c869f591b274c1631170d3e11fe" "zenz-v3.2-xsmall-gguf:4f5423f0fad41a73b1242eb96fe5c12ae4fdca83"; do
          name=${m%%:*}; rev=${m##*:}
          mkdir -p "$name"
          curl -fsSL --retry 3 -o "$name/ggml-model-Q5_K_M.gguf" \
            "https://huggingface.co/Miwa-Keita/$name/resolve/$rev/ggml-model-Q5_K_M.gguf"
        done
        mkdir -p MainApp/Vendor
        curl -fsSL --retry 3 -o /tmp/idevice.zip \
          "https://github.com/Mumicanso8323/idevice/releases/download/v0.1.68-tsukaima1/idevice-xcframework-v0.1.68-tsukaima1.zip"
        echo "4973a451d575983844d33be8e858cbd353ed7cd3e843906badf6b06acc50ed2d  /tmp/idevice.zip" | shasum -a 256 -c -
        unzip -q -o /tmp/idevice.zip -d /tmp/idevice
        XCF=$(find /tmp/idevice -maxdepth 3 -name 'IDevice.xcframework' -type d | head -1)
        test -n "$XCF"
        rm -rf MainApp/Vendor/IDevice.xcframework && cp -R "$XCF" MainApp/Vendor/

workflows:
  tsukaima-compile:
    name: 使い魔 TESTFLIGHT 構成のコンパイル確認(署名なし・手動)
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
    scripts:
      - *assets
      - name: 署名なしでビルド(TESTFLIGHT 構成)
        script: |
          set -o pipefail
          if ! xcodebuild -project azooKey.xcodeproj -scheme MainApp -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build -xcconfig Config/testflight.xcconfig \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=3.2.0 CURRENT_PROJECT_VERSION=1 build > build.log 2>&1; then
            grep -B2 -A8 "error:" build.log | head -200 || true
            tail -40 build.log
            exit 1
          fi
          grep -E "\*\* BUILD" build.log
      - name: idevice の記号が残っていないか
        script: |
          app=build/Build/Products/Release-iphoneos/azooKey.app
          bin="$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          ls "$app/PlugIns" | tee symcheck.txt
          ls -la "$bin" | tee -a symcheck.txt
          nm -a "$bin" 2>/dev/null | grep -i -E 'idevice|springboard' | sort -u | head -60 >> symcheck.txt || true
          echo "idevice_ 系の件数: $(nm -a "$bin" 2>/dev/null | grep -c -E ' _?idevice_')" | tee -a symcheck.txt
          if nm "$bin" 2>/dev/null | grep -q -E ' T _?idevice_'; then echo "idevice の関数が入っている" | tee -a symcheck.txt; exit 1; fi
          echo "idevice の関数なし" | tee -a symcheck.txt
    artifacts:
      - build.log
      - symcheck.txt

  tsukaima-testflight:
    name: 使い魔 TestFlight(手動・内部テストだけ)
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      # Codemagic のアプリの Environment variables に作る変数グループ。値は git に入れない。
      #   APP_STORE_CONNECT_ISSUER_ID / APP_STORE_CONNECT_KEY_IDENTIFIER / APP_STORE_CONNECT_PRIVATE_KEY(ASC の API キー・Admin)
      #   CERTIFICATE_PRIVATE_KEY(配布証明書の RSA 秘密鍵。置き卓通知と同じ1枚を使い回す)
      #   APPLE_TEAM_ID
      groups:
        - tsukaima_testflight
      vars:
        # SideStore 版が使っていた ID(本人の有料チーム 8Y3987TGPN に登録済み)。TestFlight 版を「更新」として入れ、端末のデータを残すため。
        MAIN_ID: jp.yusukedoi.tsukaima.azookey.8Y3987TGPN
        KEYBOARD_ID: jp.yusukedoi.tsukaima.azookey.8Y3987TGPN.keyboard
        SHARE_ID: jp.yusukedoi.tsukaima.azookey.8Y3987TGPN.share
        APP_GROUP: group.jp.yusukedoi.tsukaima.azookey.8Y3987TGPN
    scripts:
      - *assets
      - name: ID を SideStore 版の組に合わせる(bundle ID・App Group・ALTAppGroups)
        script: |
          set -e
          for f in MainApp/azooKey.entitlements Keyboard/Keyboard.entitlements TsukaimaShare/TsukaimaShare.entitlements; do
            sed -i '' "s#<string>group.jp.yusukedoi.tsukaima.azookey</string>#<string>$APP_GROUP</string>#" "$f"
            grep -q "$APP_GROUP" "$f"
          done
          # コードは ALTAppGroups(SideStore の書く実 ID)を読んで App Group を決める。TestFlight 版は同じ形を Info.plist に持たせる。
          /usr/libexec/PlistBuddy -c "Add :ALTAppGroups array" -c "Add :ALTAppGroups:0 string $APP_GROUP" MainApp/Info.plist
          sed -i '' "s#PRODUCT_BUNDLE_IDENTIFIER = jp.yusukedoi.tsukaima.azookey;#PRODUCT_BUNDLE_IDENTIFIER = $MAIN_ID;#; s#PRODUCT_BUNDLE_IDENTIFIER = jp.yusukedoi.tsukaima.azookey.keyboard;#PRODUCT_BUNDLE_IDENTIFIER = $KEYBOARD_ID;#; s#PRODUCT_BUNDLE_IDENTIFIER = jp.yusukedoi.tsukaima.azookey.share;#PRODUCT_BUNDLE_IDENTIFIER = $SHARE_ID;#" azooKey.xcodeproj/project.pbxproj
          grep -c "8Y3987TGPN" azooKey.xcodeproj/project.pbxproj
      - name: 署名の準備(ASC の API キーで配布用のプロファイルを3つ取る)
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$MAIN_ID" --type IOS_APP_STORE --create > /dev/null
          app-store-connect fetch-signing-files "$KEYBOARD_ID" --type IOS_APP_STORE --create > /dev/null
          app-store-connect fetch-signing-files "$SHARE_ID" --type IOS_APP_STORE --create > /dev/null
          keychain add-certificates
          xcode-project use-profiles --project azooKey.xcodeproj
      - name: archive と ipa
        script: |
          set -e -o pipefail
          xcode-project build-ipa --project azooKey.xcodeproj --scheme MainApp --config Release \
            --archive-flags "-xcconfig $CM_BUILD_DIR/Config/testflight.xcconfig -skipMacroValidation -skipPackagePluginValidation" \
            --archive-xcargs "MARKETING_VERSION=3.2.0 CURRENT_PROJECT_VERSION=$((BUILD_NUMBER + 300)) DEVELOPMENT_TEAM=$APPLE_TEAM_ID" 2>&1 | tee archive.log | tail -5 || { { grep -n -E "❌|error: |ARCHIVE FAILED|requires a provisioning|Provisioning profile|No profile|conflicts" archive.log | head -40; echo ---tail---; tail -50 archive.log; } | sed 's/\x1b\[[0-9;]*m//g' > archive-errors.txt; cat archive-errors.txt; exit 1; }
      - name: 外した機能が本当に入っていないか確かめる(idevice の記号・VPN 文面)
        script: |
          set -e
          ipa=$(ls build/ios/ipa/*.ipa | head -1)
          rm -rf /tmp/chk && mkdir /tmp/chk && unzip -q "$ipa" -d /tmp/chk
          app=$(ls -d /tmp/chk/Payload/*.app)
          bin="$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          for ext in "$app"/PlugIns/*.appex; do echo "plugin: $(basename "$ext")"; done
          if nm "$bin" 2>/dev/null | grep -q -E ' T _?idevice_'; then
            echo "idevice の関数が入っている"; exit 1
          fi
          echo "idevice の記号なし"
          codesign -d --entitlements - --xml "$app" | plutil -p - | head -20
    artifacts:
      - build/ios/ipa/*.ipa
      - archive-errors.txt
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # 内部テストの処理だけ。外部テスターの追加・審査への提出はしない。
        submit_to_testflight: false
